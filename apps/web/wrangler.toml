name = "openfield"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# Cloudflare Pages configuration for the Openfield video editor
# This app requires special headers for SharedArrayBuffer (used by FFmpeg.wasm)
# Custom domains:
# - https://openfield.co.in (and https://www.openfield.co.in) open the standard video editor flow
# - the motion. subdomain opens the Motion Creator surface by hostname detection

[env.production]
name = "openfield"

[env.preview]
name = "openfield-preview"
